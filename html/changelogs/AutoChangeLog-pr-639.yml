author: "Arom-beep"
delete-after: True
changes:
  - balance: "Reinforced Walls now take 8 plasteel sheets to construct instead of 5."
  - balance: "Praetorian acid grenade got increased throwing speed and launch_type changed to \"HIGH_LAUNCH\", allowing it to throw over more obstacles such as railings or closets, but in exchange \"explosion\" time is increased from 1s to 1.25s"
  - balance: "Each organ repaired during organ repair surgery requires a surgical stack."
  - balance: "Healing a hematoma no longer cures disabilities; you must take out brain chips to do so. Doing so gives you good boy points in flavor text form!"
  - balance: "You will be punished for not being careful while cutting pseudoroots and your patient will take organ damage from it. Shame on you for using bad tools or rushing.\nbalance:Sentinel base kit changed,\nbalance:Added Neurotoxin mechanic\nbalance:Added new sprites for Sentinel abilities\nbalance:Added a new sprite for the sentinel projectile"
  - balance: "Fuelpumps now can take damage from xenos during hijack (including most acid sources)"
  - balance: "Fuelpumps cannot be repaired, but have a sizeable health pool - the health of the pump is what matters for hijack now rather than area power"
  - balance: "Struggling when restrained by a xeno with a item that does any damage now has a clamped lower end damage of 25"
  - balance: "Struggling when restrained by a xeno with a item now only varies between 1/2-full of the damage instead of 1/4-full"
  - balance: "Dropships and lifeboats can now depart while the main ship is still falling to the ground."
  - balance: "Properly implement medbay chemical dispenser energy scaling, based on the number of Hospital Corpsmen."
  - balance: "Battlefield Executions are now tied to the gun, rather than the type of ammo"
  - balance: "Gun examining now care if you are adjacent to them, giving you information appropriate to the adjacency. TLDR, you aren't gonna know the status of a guns from afar such as if the magazine is loaded, or if its empty, or if the chamber is loaded, but with an empty magazine unless you are next to, or holding the weapon"
  - balance: "You can now tell what kind of bullet is currently chambered for all guns, or in the case of revolvers and break action shotguns, that are ready to fire, following the caveats of the gun examination adjacency"
  - balance: "You can now load individual bullets into specific individual chambers of a revolvers cylinder, provided it is open"
  - balance: "Examine code has been given a massive facelift, from fanciful colors to proper word grammar, shorter, and arguably, better formatting"
  - balance: "disabler capacity moved from 16 to 10, but the bolts are faster by one speed level"
  - rscadd: "Added one marine tip about being able to reinforce reagent and fuel tanks with plasteel."
  - rscadd: "adds various new thrall gear & expands their options."
  - rscadd: "adds the missing snow loadout gear, boots, rain-cover, netting."
  - rscadd: "During certain surgery steps, the patient will receive an indication that they 'feel better' after pain recalculation."
  - rscadd: "Surgery missteps or fails that cause significant harm to an awake patient, such as initiating an amputation, internal bleeding, bone fractures, and organ contamination, will now cause the patient to occasionally *pain regardless of whether they have the appropriate painkillers or not."
  - rscadd: "An awake patient, regardless of whether oxycodone is in their system, will scream (not burst scream) when the doctor tries to pull a larva out. Pain relief does not relieve pressure, after all."
  - rscadd: "Surgery missteps or failures that cause harm to the person operating or being operated on will occasionally make the victims cry out in pain."
  - rscadd: "Acid that gushes violently from surgery fails will get all over the place!"
  - rscadd: "Bone chips will spawn under the doctor successfully completing the \"Remove Bone Chips\" step on a patient."
  - rscadd: "Adds some flavor text if the small chance of a doctor breaking ribs or skulls while opening them with a retractor that tells yourself and your patient that sometimes this happens--it's nobody's fault."
  - rscadd: "Adds HIGHDANGER warnings to patients undergoing an amputation whilst awake and encourages telling the doctor to stop if the step was a mistake."
  - rscadd: "extra tacmap buttons, allows moving up and down z level and changing from ship to map on hud button map"
  - rscadd: "Full auto fire displays ammo counter every time it's divisible by 8."
  - rscadd: "Burstfire drops empty mags instead of holding onto them until the gun is completely empty. Also bypasses your eject to hand preference if that would unwield your gun during a burst."
  - rscadd: "Added new ARES announcement text to indicate when lifeboats are disabled."
  - rscadd: "SLs (and other leaders, determined by having big arrow) can now highlight mobs for 4.5 seconds by pointing at them."
  - rscadd: "Squad Leaders now buy a megaphone from their vendor for 5 points."
  - rscadd: "You can now rotate the cylinder of a revolver by a single position IF you are wielding it, accompanied with a balloon alert. The balloon alert obviously does not display during russian roulette."
  - rscadd: "You can now split handfuls by attacking it with your other, empty hand, or decrementing it by 1 to the other hand by using it inhand"
  - rscadd: "Similarly, you can now directly remove handfuls from magazines by using it inhand, assuming it has the refillable flag"
  - code_imp: "Changes some surgery step noises to make more sense."
  - code_imp: "Adds more captivating and descriptive flavor text during certain surgeries, especially if the patient is awake and not under that numb juice."
  - code_imp: "Adds a preference to toggle the end round sound theme"
  - code_imp: "Adds a preference to toggle the end round sound theme"
  - code_imp: "Boiler acid shotgun now properly flagged as AMMO_XENO"
  - code_imp: "Fire extinguishers now always call extinguish_acid on their affected atoms"
  - code_imp: "xeno handle_collision procs should now perform less redundant typechecks"
  - code_imp: "Gamemodes can now specify a required_ready_players which is how many must be ready to start the gamemode (set to 60 for WO)"
  - code_imp: "Rearranged unit testing code so it can be breakpointed correctly"
  - code_imp: "Renamed Basic medical optic, into SensorMate Optic"
  - code_imp: "SHARP no longer overrides the parent proc with its old, defunct, unload proc"
  - code_imp: "Calibers can now be used as a list, rather than just a single defined variable, fixes an exploit related to it, thankfully I'm the only one that knows of it, is what I would say if this PR was merged months ago, and if an issue related to it didn't just come up"
  - code_imp: "Adds a comment on combat statistics code regarding the accuracy variable differences"
  - code_imp: "Only your head gets gibbed on battlefield execution rather than gibbing your entire body with explosive ammo"
  - code_imp: "Defines Cyan as a color span"
  - code_imp: "touched some code"
  - code_imp: "Optimized some aspects of chemical processing."
  - refactor: "Nuked some single letter vars in the girders file."
  - refactor: "Changes Runner bone_spur code to use get_turf() instead of locate()."
  - refactor: "usage of IS_DIAGONAL_DIR implemented"
  - refactor: "Updates Berserker Ravager code for cleaner look and making it easier to follow."
  - refactor: "Refactors firing_to_air bullet chambering to be more inline with the suicide block's method"
  - refactor: "Battlefield Executions are refactored into a flag rather than a signal, and brought up to standard to suicide code and fire_to_air code"
  - imageadd: "New ghillie sprite"
  - imageadd: "adds arc icon for tech-tree."
  - imageadd: "new HUD element to track Neurotoxin stacks"
  - imageadd: "new HUD element for medhud to track Neurotoxin"
  - imageadd: "Several new overlays and a destroyed state for fuelpumps by dimdimich1996"
  - imageadd: "added icons for the SensorMate opics"
  - imagetweak: "palette correction for prey_items.dmi"
  - imagetweak: "Polished the closed chest sprite to add the sternum and clavicles; polished the open chest sprite and added some wet organs in there."
  - imagetweak: "Adds the human spriting template to the damage overlay icon as a reference."
  - imagetweak: "Resprites and realigns brain surgery overlays."
  - imagetweak: "Changed Medical Optic hud icon to represent the itemsprite better"
  - imagetweak: "changed dirs and made them saner for shuttle attachments sprites"
  - spellcheck: "The SEA's drill hat now refers to them as drill instructors rather than drill sergeants."
  - spellcheck: "Fixed some spelling and grammar errors."
  - spellcheck: "Fixed the description of Mess Technician's headset and updates the encryption key name."
  - spellcheck: "A19 magazines are worded just a tad bit more accurately"
  - spellcheck: "Reduces the word verbiage of melee and throw force text"
  - spellcheck: "Properly colorizes most of examine code, color coded based on danger/importance"
  - qol: "Adds sounds to surgery procedures that did not have any."
  - soundadd: "Adds a hemostat 'snipping' sound for the hemostat initiation step, adds surgical line sound effects for initiation and scissor snip for completing the step, and adds 3 different types of circular saw fail noises depending on what the circular saw hits."
  - soundtweak: "hemostat1.ogg swapped and renamed to hemostat2.ogg to make way for the new hemostat1.ogg"
  - soundtweak: "Some surgical steps had their sounds replaced."
  - soundtweak: "Surgical sounds now don't have any 'lag' before playing."
  - ui: "Set TGUI input text for some medal writing inputs"
  - config: "WO will now by default require 120 pop for voting instead of 140 (Also cycles on 65 rounds instead of 75)"
  - maptweak: "changed dir on a door in a shuttle on hybrisa to match the new directions for icon states"
  - maptweak: "touched shuttles a little bit, added new floor type and put them underneath the airlocks"
  - rscdel: "Removed unused radio code"
  - bugfix: "Fixed cades that got unwired not getting back their pass_flags."
  - bugfix: "Synth maintenance station in req, replaced with old sprite."
  - bugfix: "Ghosts now properly get moved to new xenos as they evolve / devo."
  - bugfix: "Surgery missteps or failures that cause significant harm to a patient, such as contamination, internal bleeding, or bone fractures, will now be evident in the surgery step text. Not to mention, the patient will scream at you."
  - bugfix: "Patients must be anesthetized with oxycodone for them not to feel their limb being chopped off for whatever reason."
  - bugfix: "Nonbinary pronouns can now appear in surgical steps instead of defaulting to 'his'."
  - bugfix: "Brain surgery overlays are no longer misaligned from the skull."
  - bugfix: "Guaranteed slot T2 xenos cannot transmute over the T2 slot capacity."
  - bugfix: "Xenos don't lose transmute by selecting their current caste."
  - bugfix: "Burn kits and ointment are usable again on areas like the dropship."
  - bugfix: "Fixed bullet ping override offsets being ignored namely for vehicles (and now fuelpumps)."
  - bugfix: "Xenos now get more hijack sfx."
  - bugfix: "Fixed weird crusher charge logic for handling of anchored objects."
  - bugfix: "Autodoc pods and cryo pods now account for eschars and third degree burns."
  - bugfix: "Message about not being able to perform surgery due to bad conditions... the turf your standing on. I.E Water/Coast/Dropship."
  - bugfix: "Intel aSLs now get Command Comms and they properly transfer on swapping aSL."
  - bugfix: "XO RTO bag price oversight."
  - bugfix: "Fixed groundside operation panel not working on WO because there's no almayer AA gun."
  - bugfix: "Fixed WO CO and XO being unable to issue medals."
  - bugfix: "Removed a light bulb floating off the side of the Normandy in mid air."
  - bugfix: "Dead Yautja Bodies can now be tracked in Body Bags by bracers."
  - bugfix: "fixed IS_DIAGONAL_DIR check."
  - bugfix: "Using guns on burst-fire now displays the ammo counter again."
  - bugfix: "Akimbo firing causing a signal override."
  - bugfix: "Weird burst-fire queuing that could make it lose track of amount of shots in a burst."
  - bugfix: "Fixed medbay chemical dispensers energy fully refilling each time a marine latejoined."
  - bugfix: "fixed Req Tutorial marines asking for impossible item"
  - bugfix: "Restores the ability to knockout others in a boxing match"
  - bugfix: "Fixed the QYJ Machine Gun for the UPP having magazines that counted as \"small\" in a backpack, it is now set to medium like the Smartgun magazines"
  - bugfix: "Shooting target damage display now accounts for damage falloff."
  - bugfix: "Bullets hit shooting target without spriteclick too. As a result you can't walk through a target but you can unanchor it to pass and xeno can break it."
  - bugfix: "Double barrel shotguns and its subtypes no longer unwield when you close the chamber"
  - bugfix: "Fixes bolt actions deleting inserted bullets"
  - bugfix: "Fixes bolt actions allowing bullets to be inserted while the bolt is closed"
  - spellcheck: "Adds some more text regarding bolt action... actions"
  - bugfix: "Fixes the CO's M1911 Custom from being explodable and acidable, matching with the rest of their sidearms"
  - bugfix: "Fixes flamer attachment unnecessarily appending a cooldown on firing failures"
  - bugfix: "Fixes rail flashlights breaking when turning it on during a detach by forcing it off in the codeblock. Although, there could have been merit to just prevent using any of the procs during a detach, but this worked just as fine."
  - code_imp: "Autodocs more than just a few variables, cleans up single letter variables, and clarifies a few comments"
  - bugfix: "Fixes negative falloff by clamping the falloff min value to 0"
  - bugfix: "Fixes a bug related to wield assisting when the active hand does not contain the gun, adds a failure text whenever this happens instead"
  - bugfix: "Battlefield Executions now properly use up its ammo on execution"
  - bugfix: "You can no longer use combat statistics to cheat russian roulette"
  - bugfix: "Revolver cylinders no longer spin backwards when fired"
  - bugfix: "Revolvers no longer automatically open when attempting to fire when empty"
  - bugfix: "Heavy buckshot shells no longer generate an incorrect ammo capacity"
  - code_imp: "No longer hardcodes max_rounds on most generate_handful procs as the argument is defunct now. As a result, max_rounds are now retrieved based on handful type, which means contributors should be defining handfuls in the future, although the parent is typically more than enough in most cases. As a stopgap solution to problems that may occur, handfuls max_rounds are properly adjusted if it exceeds the current_rounds"
  - bugfix: "Revolver, lever_action, and shotgun handfuls now properly generate as its typepath, rather than the handful parent"
  - bugfix: "CO revolver belts can now hold revolver handfuls as well, similar to the other revolver belt"
  - bugfix: "Fixes suicide code not respecting the damage multiplier of a gun when committing suicide on an otherwise head-exploding projectile"
  - bugfix: "fixed door rotations"