author: "Arom-beep"
delete-after: True
changes:
  - rscadd: "Plastic knives now have the basic sharpness trait and can cut food crudely"
  - rscadd: "Added a new mobile TV stand in brig storage"
  - rscadd: "Added a guaranteed black market tuner in brig evidence storage"
  - rscadd: "Added a new wall cryopod subtype"
  - rscadd: "Added a new \"brig\" subtype of the wall cryopod, which automatically informs MP's when a prisoner has cryo'd and ejects their incident report."
  - rscadd: "Adds MP synth to security"
  - rscadd: "Adds HUD icons for all NSPA members."
  - rscadd: "Added the FCT - Field Camera Tripod for use by Combat Technicians in the Field, allowing Overwatch to see static positions."
  - rscadd: "You can close unprepared incisions without having to skip to using the retractor, now."
  - rscadd: "Multiple skippable surgery steps are now possible."
  - rscadd: "Adds two Abort Surgery surgeries, one with surgical line and one with the cautery."
  - rscadd: "Added WotQ Keybind option."
  - rscadd: "Dropship modules can now be repaired with a welder."
  - rscadd: "Deployable (DS and non-DS) sentries and MGs now continuously sync their health between the module and the weapon."
  - rscadd: "IOs get marine engineering access instead of civilian."
  - rscadd: "Adds role comms for Surgeon and Pharmaceutical Physician: Surg and Phm. Phys. No more screaming at the Surgeon to make medicine when there are two other Pharmacists available, okay, Chief?"
  - spellcheck: "Large wooden walls now say they're made of wood"
  - refactor: "Updates spark_spread effect system to use subsystem processing and timers instead of sleeps"
  - refactor: "Sparks move a bit faster/smoother"
  - refactor: "Updates Praetorian code for cleaner look and making it easier to follow."
  - code_imp: "Added new brig areas"
  - code_imp: "Repathed plastic utensils to be subtypes of their respective normal utensils"
  - code_imp: "Fixed a runtime where radios attempted to send messages to atoms with null locations"
  - code_imp: "added a var to set if clothing removes undergarments overlays or not."
  - code_imp: "all living mobs now have procs for riding"
  - code_imp: "adding the riding element is easier"
  - bugfix: "APC terminals no longer overlay over catwalks and the like"
  - bugfix: "Shotguns now respect your preference regarding hurting yourself"
  - bugfix: "Fixes the Field Cameras' label reading \"this label label reads\"..."
  - bugfix: "Moves the Field Cameras' labels to the examine box rather than outputting it to the chatbox."
  - bugfix: "Surgery to the chest/head no longer requires you to clamp bleeders up to twice before you can open it."
  - bugfix: "Fixed 'Set Operations Commander' admin verb breaking under certain circumstances."
  - bugfix: "Ship Intercomms & Shortwaves work again"
  - bugfix: "Fixed Cryopod internal intercoms being sent to the void upon ejecting."
  - bugfix: "Fixed some exploitable race conditions with Cryopods."
  - bugfix: "SEAs with no preference on their rank spawn as Gunnery Sergeants rather than Civs."
  - bugfix: "The IMS and Laser Scalpel will now once again skip their associated steps."
  - bugfix: "Regulating chemicals will no longer trigger red holotags"
  - bugfix: "Xenos can no longer hide under flames with the fire resistance boon."
  - bugfix: "Field Doc can access their room again"
  - bugfix: "Fixes being able to execute certain surgery steps out of order."
  - bugfix: "Prevents the ability to cauterize/sew a patient early during an incomplete surface or deep surgery."
  - bugfix: "CMP's office now requires CMP's credentials to access"
  - bugfix: "Document chest drawers now no longer grow into regular ones when items are placed inside"
  - bugfix: "Knife utensils will no longer scoop up food onto themselves, and instead will try to cut"
  - bugfix: "Defenders dying while having their crest down or fortified no longer stops them from being buckled to a rollerbed."
  - bugfix: "Fixed Despoiler acid barrage direct hits applying a new acid effect on every hit instead of refreshing the existing one"
  - bugfix: "Fixes Yautja Meshsuits removing undergarments"
  - bugfix: "Fixes the Field Cameras' label reading \"this label label reads\"..."
  - bugfix: "Moves the Field Cameras' labels to the examine box rather than outputting it to the chatbox."
  - bugfix: "Hive-status now accurately reports the number of available T2/T3 slots."
  - bugfix: "Airlock Electronics + Some other things like Fire doors now accept Marine Engineering access to access."
  - bugfix: "static red headband now appears on helmets when added"
  - bugfix: "Fixed some maps having indestructible machinegun emplacements"
  - balance: "Added the FCT to Maintenance Technician, Requisition and Combat Technician vendors."
  - balance: "Removed HEFA Grenade Packs from the XO vendor."
  - balance: "Acid applied to an installed dropship module now deals damage overtime instead of simply deleting it."
  - balance: "Acided dropship modules can no longer be picked up with a powerloader."
  - qol: "If you can't complete a surgical step with a tool, the game will tell you so and it will also tell you what surgeries are available at the current step to give you a clue on what tools you CAN use."
  - qol: "Expanded SEA, XO, ASO, and Staff Officer vendor equipment options."
  - qol: "Added Operations Uniforms, External Webbing, Insulated Combat Gloves, Security HUD Glasses, and additional storage accessories to applicable vendors."
  - qol: "Added additional cosmetic patch options to SEA and ASO vendors."
  - qol: "Made command-role patch items unlimited stock."
  - qol: "SOCOM and grenade packs can now be collapsed"
  - qol: "Grenade belt and satchel can now be filed by being slapped by themself, each other, and via grenade packs n boxes"
  - qol: "M56D and M2C mags can be used to refil other mags of their own kind"
  - qol: "M56D mags can be manually loaded/unloaded"
  - qol: "Cryoing now only takes 1 minute upon entering the cryobed, except for players who were forced inside while SSD unless they are the aCO."
  - qol: "If the current aCO cryoes ARES will automatically pick a new aCO."
  - qol: "Players in the process of cryoing will get skipped during autopromotion by ARES."
  - admin: "Many logs, admin messages, and attack logs now are normalized to use the ckey rather than full key - this is important in regard to consistency for searching in logs for example"
  - admin: "Users in admin messages will now be marked as disconnected even if there is no PM link for them"
  - admin: "Ghosted or otherwise out-of-body users will now show their previous ckey in admin messages rather than no key"
  - admin: "Most logging (and fingerprints) should now properly use ckey, instead of key"
  - rscdel: "The Agents item tracker is now disabled, since agents are gone."
  - rscdel: "Removed the MP bunk areas"
  - rscdel: "Removed the yard hydroponics area (groceries are available in the kitchenette)"
  - rscdel: "Removed rangefinders that spawn with survivors on Chance's Claim and Tyrargo Rift"
  - rscdel: "Removes some civilian engineering access from shipside roles."
  - rscdel: "Removes invisible borders on most of the command staff and officers."
  - maptweak: "Completely remodeled the brig"
  - maptweak: "Moved interrogation to be accessible by brigged prisoners without pausing their timers"
  - maptweak: "Moved the armory and execution rooms to a new lower level of the brig"
  - maptweak: "Expanded the CMP's office"
  - maptweak: "Expanded brig holding"
  - maptweak: "Expanded the yard"
  - maptweak: "Expanded the execution room"
  - maptweak: "Added an attachment vendor to the MP prep area (rejoice! I don't have to steal from your preps anymore)"
  - maptweak: "Added rangefinders on Chance's Claim and Tyrargo Rift. The rangefinder spawns north of Fitness on CC, and in the northwest corner of upper Apartments on Tyrargo."
  - mapadd: "Added a basketball court to the yard"
  - mapadd: "Added a kitchenette to the yard"
  - mapadd: "Added a visitation area to the brig"
  - mapadd: "Added a new brig lobby area"
  - mapadd: "Added an MP cryo storage to the lower level evidence locker"
  - mapadd: "Added these new brig cryopods to brig perma cells"
  - imagetweak: "Fixed a 1 pixel alignment issue with the west-facing onmob sprites for the Jungle and Classic CO M11C helmets."
  - imagetweak: "Fixes HUD borders and baubles, differentiates between heads of staff and officers."
  - imagetweak: "SEA's border is now grey; they are not officers, so should not have brown borders. They do have a colored 'A', though."
  - imagetweak: "Synthetic K9 units' HUD icons are now represented by a puppy."
  - imagetweak: "A minimap border has been renamed and reshaded."
  - imageadd: "Adds HUD and minimap icons for the CMC, ACMC, General, event staff, dress blues, and several of the Provost staff; adds an HUD icon for the Combat Correspondent; adds HUD and minimap icons for Surgeon and Pharmaceutical Physician."
  - ui: "RMC get sorted properly, IASF get a colour correctly assigned in the Orbit menu"